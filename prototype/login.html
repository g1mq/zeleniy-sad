<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вход — прототип «Зелёный Сад»</title>
  <link rel="stylesheet" href="css/prototype.css">
</head>
<body>
  <header class="header">
    <div class="logo" style="justify-content:center"><img src="images/logo.png" alt="ООО «Зелёный Сад»" class="logo-img logo-img--auth"><small style="color:#8b7355;display:block;text-align:center">Природа в вашем доме</small></div>
  </header>
  <div class="screen">
    <div class="card" style="max-width:400px;margin:40px auto">
      <h1 style="text-align:center">Вход в систему</h1>
      <div class="field"><label>Логин</label><input placeholder="admin_garden"></div>
      <div class="field"><label>Пароль</label><input type="password" placeholder="••••••••"></div>
      <button class="btn btn-primary" style="width:100%">Войти</button>
      <p style="text-align:center;margin-top:16px">
        <a href="register.html">Регистрация</a> · <a href="catalog.html">Войти как гость →</a>
      </p>
    </div>
    <div class="ds-panel">
      <h3>Дизайн-система (для Figma)</h3>
      <button class="btn btn-primary">Default</button>
      <button class="btn btn-primary" style="background:#16a34a">Hover</button>
      <button class="btn btn-primary" style="transform:scale(0.98)">Pressed</button>
      <button class="btn btn-primary" disabled>Disabled</button>
    </div>
  </div>
</body>
</html>
